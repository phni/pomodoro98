id: io.github.phni.Pomodoro98
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: pomodoro98

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio

modules:
  - name: tcl9.0
    buildsystem: autotools
    subdir: unix
    build-options:
      env:
        # Tcl 9.0.4 configures its bundled packages with the just-built tclsh,
        # which needs the not-yet-installed libtcl9.0.so.
        LD_LIBRARY_PATH: /run/build/tcl9.0/unix
    config-opts:
      - --disable-zipfs
    post-install:
      - chmod 755 /app/lib/libtcl9.0.so
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /man
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/tcl/tcl9.0.4-src.tar.gz
        x-checker-data:
          type: html
          url: https://www.tcl-lang.org/software/tcltk/download.html
          version-pattern: tcl(9\.0\.\d+)-src\.tar\.gz
          url-template: https://downloads.sourceforge.net/tcl/tcl$version-src.tar.gz
        sha256: d0aed49230bc02a65c1e0229e65f34590a4b037ec40d546f32573b467f7551ea

  - name: tk9.0
    buildsystem: autotools
    subdir: unix
    config-opts:
      - --disable-zipfs
    post-install:
      - chmod 755 /app/lib/libtcl9tk9.0.so
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /man
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/tcl/tk9.0.4-src.tar.gz
        x-checker-data:
          type: html
          url: https://www.tcl-lang.org/software/tcltk/download.html
          version-pattern: tk(9\.0\.\d+)-src\.tar\.gz
          url-template: https://downloads.sourceforge.net/tcl/tk$version-src.tar.gz
        sha256: d7a146d2917eb8b5cc95276dbf0e3d03c7464d2b19c1675357857c989301dbb4

  # The runtime's Python has no tkinter. Build _tkinter and Lib/tkinter from the
  # CPython release matching the runtime Python (3.14.8 in Freedesktop 26.08.3)
  # against the bundled Tcl/Tk. Bump this source whenever the runtime's Python
  # version changes.
  - name: tkinter
    buildsystem: simple
    build-commands:
      - python3 check_tkinter_source.py
      - >-
        gcc -shared -fPIC -O2 -DPy_BUILD_CORE_MODULE
        -I/usr/include/python3.14 -I/usr/include/python3.14/internal
        -IModules -I/app/include
        Modules/_tkinter.c
        -o "_tkinter$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')"
        -L/app/lib -ltcl9tk9.0 -ltcl9.0 -Wl,-rpath,/app/lib
      - install -Dm755 -t /app/lib/python3.14/site-packages _tkinter*.so
      - cp -a Lib/tkinter /app/lib/python3.14/site-packages/
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.14.8/Python-3.14.8.tar.xz
        sha256: c2215904f02b175596dc49351585104f4bc20341e1c47378b26a2c274360ce73
      - type: file
        path: flatpak/check_tkinter_source.py

  - name: pomodoro98
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-build-isolation --no-deps --no-index .
      - install -Dm644 LICENSE /app/share/licenses/io.github.phni.Pomodoro98/LICENSE
      - install -Dm644 flatpak/io.github.phni.Pomodoro98.desktop /app/share/applications/io.github.phni.Pomodoro98.desktop
      - install -Dm644 flatpak/io.github.phni.Pomodoro98.metainfo.xml /app/share/metainfo/io.github.phni.Pomodoro98.metainfo.xml
      - mkdir -p /app/share/icons
      - cp -a flatpak/icons/hicolor /app/share/icons/hicolor
    sources:
      - type: dir
        path: .
