[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pomodoro98"
dynamic = ["version"]
description = "A Windows 98-styled Pomodoro timer built with Tkinter"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "phni" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: X11 Applications",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
tray = ["pystray", "Pillow"]
audio = ["simpleaudio"]
dev = ["pytest", "pytest-cov", "ruff", "pre-commit"]

[project.scripts]
pomodoro98 = "pomodoro98.app:main"

[project.urls]
Homepage = "https://github.com/phni/pomodoro98"
Issues = "https://github.com/phni/pomodoro98/issues"

[tool.setuptools.dynamic]
version = { attr = "pomodoro98.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pomodoro98 = ["icons/*.png", "sounds/*.wav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, pyupgrade, simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
